# Sync gtmt-api env vars to Coolify via API.
# Mirrors hear-the-music-tree-api's sync-env-to-coolify.yml (same composite action, same
# fragment-never-leaves-the-runner approach).
# DATABASE_URL and GROW_API_KEY are NOT included here — both are owned by Ansible
# infrastructure (group_vars/all.yml) to avoid two sources of truth drifting apart. GROW_API_KEY
# in particular is generated once by Ansible's generate_app_secrets.yml and shared verbatim with
# grow-the-music-tree-frontend's GTMT_API_KEY — setting it here too would race Ansible's runs and
# desync the two apps.
# Requires org-level vars COOLIFY_API_SUBDOMAIN, DOMAIN_NAME, GTMT_API_SUBDOMAIN, SYSTEM_USERNAME
# and org-level secrets COOLIFY_API_TOKEN, SECRET_KEY.
# Uses COOLIFY_API_SUBDOMAIN (not COOLIFY_SUBDOMAIN): the latter is gated by Cloudflare
# Access (browser SSO only) and rejects unattended CI requests with a 302 redirect.
name: Sync env to Coolify

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync-staging:
    name: Sync API env (staging)
    runs-on: ubuntu-latest
    environment: STAGING
    steps:
      - name: Validate vars and build API env fragment
        env:
          SYSTEM_USERNAME: ${{ vars.SYSTEM_USERNAME }}
          ALLOWED_HOSTS: "${{ vars.GTMT_API_SUBDOMAIN }}-staging.${{ vars.DOMAIN_NAME }}"
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          : > fragment.env
          required=(SYSTEM_USERNAME ALLOWED_HOSTS SECRET_KEY)
          missing=()
          for v in "${required[@]}"; do
            [ -z "${!v}" ] && missing+=("$v")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "ERROR: Missing required vars or secrets: ${missing[*]}"
            exit 1
          fi
          echo "All required vars and secrets are set."
          for key in SECRET_KEY SYSTEM_USERNAME ALLOWED_HOSTS; do
            val="${!key}"
            val=$(printf '%s' "$val" | tr -d '\n\r')
            [ -n "${val}" ] && printf '%s=%s\n' "$key" "$val" >> fragment.env
          done

      - name: Sync env vars to Coolify
        uses: BehindTheMusicTree/github-workflows/.github/actions/sync-env-to-coolify@main
        with:
          app_name: gtmt-api
          coolify_environment: staging
          fragment_path: fragment.env
          coolify_subdomain: ${{ vars.COOLIFY_API_SUBDOMAIN }}
          domain: ${{ vars.DOMAIN_NAME }}
          coolify_api_token: ${{ secrets.COOLIFY_API_TOKEN }}

  sync-prod:
    name: Sync API env (prod)
    runs-on: ubuntu-latest
    environment: PROD
    steps:
      - name: Validate vars and build API env fragment
        env:
          SYSTEM_USERNAME: ${{ vars.SYSTEM_USERNAME }}
          ALLOWED_HOSTS: "${{ vars.GTMT_API_SUBDOMAIN }}.${{ vars.DOMAIN_NAME }}"
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          : > fragment.env
          required=(SYSTEM_USERNAME ALLOWED_HOSTS SECRET_KEY)
          missing=()
          for v in "${required[@]}"; do
            [ -z "${!v}" ] && missing+=("$v")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "ERROR: Missing required vars or secrets: ${missing[*]}"
            exit 1
          fi
          echo "All required vars and secrets are set."
          for key in SECRET_KEY SYSTEM_USERNAME ALLOWED_HOSTS; do
            val="${!key}"
            val=$(printf '%s' "$val" | tr -d '\n\r')
            [ -n "${val}" ] && printf '%s=%s\n' "$key" "$val" >> fragment.env
          done

      - name: Sync env vars to Coolify
        uses: BehindTheMusicTree/github-workflows/.github/actions/sync-env-to-coolify@main
        with:
          app_name: gtmt-api
          coolify_environment: production
          fragment_path: fragment.env
          coolify_subdomain: ${{ vars.COOLIFY_API_SUBDOMAIN }}
          domain: ${{ vars.DOMAIN_NAME }}
          coolify_api_token: ${{ secrets.COOLIFY_API_TOKEN }}
