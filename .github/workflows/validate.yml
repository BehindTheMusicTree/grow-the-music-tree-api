name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: validate-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    # Dummy config only, no DB/secrets: mypy just needs settings.py importable via the django-stubs plugin.
    env:
      SECRET_KEY: mypy-ci-dummy-key
      PIPELINE_API_KEY: mypy-ci-dummy-key
      CURATION_API_KEY: mypy-ci-dummy-curation-key
      GOOGLE_OAUTH_CLIENT_ID: mypy-ci-dummy-client-id
      ADMIN_GOOGLE_SUB: mypy-ci-dummy-sub
      YOUTUBE_API_KEY: mypy-ci-dummy-youtube-key
      DATABASE_URL: sqlite:///mypy-ci.sqlite3
      REDIS_URL: redis://localhost:6379/0
    steps:
      - name: Checkout code
        uses: actions/checkout@v5.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy grow packages/grow-contracts/src

  migration-check:
    name: Migration check
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: tests.settings
      PYTHONPATH: .
    steps:
      - name: Checkout code
        uses: actions/checkout@v5.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: makemigrations --check
        run: uv run django-admin makemigrations grow --check --dry-run

  api-schema:
    name: API schema check
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: tests.settings
      PYTHONPATH: .
    steps:
      - name: Checkout code
        uses: actions/checkout@v5.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Regenerate openapi.yaml (drf-spectacular)
        run: uv run django-admin spectacular --file openapi.yaml --validate

      - name: Committed openapi.yaml is current
        run: git diff --exit-code openapi.yaml

  pytest:
    name: Pytest
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Checkout code
        uses: actions/checkout@v5.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Run pytest
        run: uv run pytest --cov-branch --cov-report=xml:coverage-sqlite.xml --cov-fail-under=0

      - name: Install PostgreSQL 16 client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"

      - name: Run Postgres-only pytest
        run: uv run pytest -m postgres --ds=tests.postgres_settings --cov-branch --cov-report=xml:coverage-postgres.xml --cov-fail-under=0

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-pytest
          path: coverage-*.xml
          if-no-files-found: error

  coverage:
    needs: pytest
    permissions:
      contents: read
    uses: BehindTheMusicTree/github-workflows/.github/workflows/coverage.yml@18b90bc9c64b9abab0a86e7ea74f65acac93aec1 # v6.6.0
    with:
      line: 85

  tests-success:
    name: Tests success
    if: always()
    needs: [pytest, coverage]
    runs-on: ubuntu-24.04
    steps:
      - name: All test jobs succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<<"$NEEDS"
