name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # The pipelines schema can change without a grow commit: catch the drift before the next staging run.
  schedule:
    - cron: "17 5 * * *"

jobs:
  lint:
    if: github.event_name != 'schedule'
    name: Lint
    runs-on: ubuntu-latest
    # Dummy config only, no DB/secrets: mypy just needs settings.py importable via the django-stubs plugin.
    env:
      SECRET_KEY: mypy-ci-dummy-key
      PIPELINE_API_KEY: mypy-ci-dummy-key
      CURATION_API_KEY: mypy-ci-dummy-curation-key
      GOOGLE_OAUTH_CLIENT_ID: mypy-ci-dummy-client-id
      ADMIN_GOOGLE_SUB: mypy-ci-dummy-sub
      YOUTUBE_API_KEY: mypy-ci-dummy-youtube-key
      DATABASE_URL: sqlite:///mypy-ci.sqlite3
      REDIS_URL: redis://localhost:6379/0
    steps:
      - name: Checkout code
        uses: actions/checkout@v5.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy grow

  migration-check:
    if: github.event_name != 'schedule'
    name: Migration check
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: tests.settings
      PYTHONPATH: .
    steps:
      - name: Checkout code
        uses: actions/checkout@v5.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: makemigrations --check
        run: uv run django-admin makemigrations grow --check --dry-run

  pytest:
    if: github.event_name != 'schedule'
    name: Pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Checkout code
        uses: actions/checkout@v5.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Run pytest
        run: uv run pytest

      - name: Install PostgreSQL 16 client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"

      - name: Run Postgres-only pytest
        run: uv run pytest -m postgres --ds=tests.postgres_settings --no-cov

  gold-contract:
    name: Gold contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      - name: Sync dependencies
        run: uv sync --all-extras

      # The pipelines branch mirroring grow's: develop for develop/feature work, main for main/hotfix.
      - name: Fetch the Gold tree schema
        env:
          TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}
          # The pipelines repo is private: a fine-grained token with Contents:read on it.
          PIPELINES_READ_TOKEN: ${{ secrets.PIPELINES_READ_TOKEN }}
        run: |
          case "$TARGET_BRANCH" in
            main) ref=main ;;
            *) ref=develop ;;
          esac
          : "${PIPELINES_READ_TOKEN:?PIPELINES_READ_TOKEN secret is not set}"
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $PIPELINES_READ_TOKEN" \
            --header "Accept: application/vnd.github.raw+json" \
            "https://api.github.com/repos/BehindTheMusicTree/the-music-tree-pipelines/contents/pipelines/gold/src/gold/schemas/genre_tree.schema.json?ref=${ref}" \
            --output "$RUNNER_TEMP/genre_tree.schema.json"
          echo "GOLD_SCHEMA_PATH=$RUNNER_TEMP/genre_tree.schema.json" >> "$GITHUB_ENV"

      - name: Run the contract tests
        run: uv run pytest -m contract --no-cov
