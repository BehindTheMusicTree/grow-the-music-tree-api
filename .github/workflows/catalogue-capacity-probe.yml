name: Catalogue capacity probe

# Throwaway probe for #511 step 0: can a hosted runner hold and restore a prod-scale (about 31M songs) synthetic
# catalogue? Not meant to merge. No prod data is involved.
on:
  pull_request:
    paths:
      - benchmarks/catalogue/capacity_probe/**
      - .github/workflows/catalogue-capacity-probe.yml
  workflow_dispatch:

jobs:
  probe:
    name: Catalogue capacity probe
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5.0.1

      - name: Runner resources
        run: |
          nproc
          free -g
          df -h
          lsblk

      - name: Free disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/share/swift /usr/local/lib/node_modules /opt/microsoft \
            /usr/local/share/powershell /usr/local/.ghcup
          docker image prune -af
          df -h /

      - name: XFS work volume
        run: |
          avail=$(df --output=avail -B1G / | tail -1 | tr -d ' ')
          # 6 GB are left for Docker images, logs and uv.
          size=$((avail - 6))
          echo "free on /: ${avail} GB, volume: ${size} GB"
          # Preallocated so that running out of space fails inside XFS, not as a loop I/O error.
          sudo fallocate -l "${size}G" /mnt/catalogue.img
          sudo mkfs.xfs -q -m reflink=1 /mnt/catalogue.img
          sudo mkdir -p /mnt/catalogue
          sudo mount -o loop,noatime /mnt/catalogue.img /mnt/catalogue
          sudo chown "$USER" /mnt/catalogue
          xfs_info /mnt/catalogue | tee /dev/stderr | grep -q 'reflink=1'
          df -h /mnt/catalogue
          echo "PROBE_DIR=/mnt/catalogue" >>"$GITHUB_ENV"

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      - run: uv sync --all-extras

      - name: Probe
        run: benchmarks/catalogue/capacity_probe/probe.sh "$PROBE_DIR" "$RUNNER_TEMP/summary.md"

      - name: Job summary
        if: always()
        run: if [[ -f "$RUNNER_TEMP/summary.md" ]]; then cat "$RUNNER_TEMP/summary.md" >>"$GITHUB_STEP_SUMMARY"; fi

      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capacity-probe-summary
          path: ${{ runner.temp }}/summary.md
          if-no-files-found: ignore
