components:
  schemas:
    AlbumDetailed:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        year:
          type:
          - string
          - 'null'
          maxLength: 4
        albumArtists:
          type: array
          items:
            $ref: '#/components/schemas/ArtistMinimum'
        tracksSorted:
          type: array
          items:
            $ref: '#/components/schemas/TrackSimpleWithoutAlbumWithPositionInAlbum'
        tracksCount:
          type: integer
        createdOn:
          type: string
          format: date-time
          readOnly: true
        updatedOn:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - albumArtists
      - createdOn
      - name
      - tracksCount
      - tracksSorted
      - uuid
    AlbumMinimum:
      type: object
      description: |-
        Base serializer class for input validation (POST, PUT, etc.).

        This serializer extends Django REST Framework's Serializer to provide input validation features:
        - Consistent error handling using AppValidationException
        - Multipart form data normalization and validation
        - Duplicate field detection
        - Unknown field detection
        - List field handling with [] suffix for multipart requests

        Note: This serializer is specialized for INPUT validation. Output serializers
        (read-only, for GET responses) do not need AppInputSerializer and can inherit directly
        from serializers.ModelSerializer.
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        albumArtists:
          type: array
          items:
            $ref: '#/components/schemas/ArtistMinimum'
      required:
      - albumArtists
      - name
      - uuid
    AlbumSimple:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        year:
          type:
          - string
          - 'null'
          maxLength: 4
        albumArtists:
          type: array
          items:
            $ref: '#/components/schemas/ArtistMinimum'
        tracksCount:
          type: integer
        createdOn:
          type: string
          format: date-time
          readOnly: true
      required:
      - albumArtists
      - createdOn
      - name
      - tracksCount
      - uuid
    AliasEvidence:
      type: object
      properties:
        automaticItemId:
          type: string
          pattern: ^(?:Q[1-9][0-9]*|LOCAL:[a-z0-9]+(?:-[a-z0-9]+)*)$
        currentLabel:
          type: string
    AliasExposure:
      type: object
      properties:
        recording:
          type: integer
          minimum: 0
        releaseGroup:
          type: integer
          minimum: 0
        artist:
          type: integer
          minimum: 0
        any:
          type: integer
          minimum: 0
      required:
      - any
      - artist
      - recording
      - releaseGroup
    AliasIssue:
      type: object
      properties:
        tag:
          type: string
        targetItemId:
          type: string
          pattern: ^(?:Q[1-9][0-9]*|LOCAL:[a-z0-9]+(?:-[a-z0-9]+)*)$
        lastKnownLabel:
          type: string
        reason:
          $ref: '#/components/schemas/AliasIssueReasonEnum'
        exposure:
          $ref: '#/components/schemas/AliasExposure'
        evidence:
          $ref: '#/components/schemas/AliasEvidence'
      required:
      - evidence
      - exposure
      - lastKnownLabel
      - reason
      - tag
      - targetItemId
    AliasIssueReasonEnum:
      enum:
      - alias_target_missing
      - alias_target_ineligible
      - alias_source_auto_resolved
      type: string
      description: |-
        * `alias_target_missing` - alias_target_missing
        * `alias_target_ineligible` - alias_target_ineligible
        * `alias_source_auto_resolved` - alias_source_auto_resolved
    AliasReview:
      type: object
      properties:
        curationExportedOn:
          type: string
          format: date-time
        issues:
          type: array
          items:
            $ref: '#/components/schemas/AliasIssue'
        targets:
          type: array
          items:
            $ref: '#/components/schemas/AliasTarget'
      required:
      - curationExportedOn
      - issues
      - targets
    AliasTarget:
      type: object
      properties:
        id:
          type: string
          pattern: ^(?:Q[1-9][0-9]*|LOCAL:[a-z0-9]+(?:-[a-z0-9]+)*)$
        label:
          type: string
        tree:
          $ref: '#/components/schemas/TreeEnum'
      required:
      - id
      - label
      - tree
    ArtistDetailed:
      type: object
      description: |-
        Lets a serializer declare the joins, prefetches and annotations its own fields read, so
        `AppModelViewSet` loads them up front instead of issuing queries per serialized row.

        `prefix` is the relation path from the queryset's model to this serializer's instance, which
        lets a parent serializer compose a nested one's needs next to the field that nests it:

            @classmethod
            def setup_queryset(cls, queryset, prefix=""):
                queryset = queryset.select_related(f"{prefix}criteria")
                return CriteriaSerializer.setup_queryset(queryset, prefix=f"{prefix}criteria__")

        Detailed responses re-read the instance through `setup_queryset`, so attributes or annotations an
        overridden `get_object` put on the instance are not seen by an opted-in serializer.
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        musicbrainzArtistId:
          type:
          - string
          - 'null'
          format: uuid
        type:
          oneOf:
          - $ref: '#/components/schemas/TypeEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        country:
          type:
          - string
          - 'null'
          maxLength: 2
        beginYear:
          type:
          - integer
          - 'null'
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        endYear:
          type:
          - integer
          - 'null'
