openapi: 3.0.3
info:
  title: TheMusicTree grow API
  version: '1'
paths:
  /health/:
    get:
      operationId: health_retrieve
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: The database check failed.
  /v1/albums/:
    get:
      operationId: v1_albums_list
      parameters:
      - in: query
        name: album_artist_name
        schema:
          type: string
      - in: query
        name: created_on
        schema:
          type: string
          format: date-time
      - in: query
        name: created_on_gt
        schema:
          type: string
          format: date-time
      - in: query
        name: created_on_gte
        schema:
          type: string
          format: date-time
      - in: query
        name: created_on_lt
        schema:
          type: string
          format: date-time
      - in: query
        name: created_on_lte
        schema:
          type: string
          format: date-time
      - in: query
        name: name
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: updated_on
        schema:
          type: string
          format: date-time
      - in: query
        name: updated_on_gt
        schema:
          type: string
          format: date-time
      - in: query
        name: updated_on_gte
        schema:
          type: string
          format: date-time
      - in: query
        name: updated_on_lt
        schema:
          type: string
          format: date-time
      - in: query
        name: updated_on_lte
        schema:
          type: string
          format: date-time
      tags:
      - v1
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAlbumSimpleList'
          description: ''
  /v1/albums/{uuid}/:
    get:
      operationId: v1_albums_retrieve
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this album.
        required: true
      tags:
      - v1
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlbumDetailed'
          description: ''
    delete:
      operationId: v1_albums_destroy
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this album.
        required: true
      tags:
      - v1
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '204':
          description: No response body
  /v1/artists/:
    get:
      operationId: v1_artists_list
      parameters:
      - in: query
        name: created_on
        schema:
          type: string
          format: date-time
      - in: query
        name: created_on_gt
        schema:
          type: string
          format: date-time
      - in: query
        name: created_on_gte
        schema:
          type: string
          format: date-time
      - in: query
        name: created_on_lt
        schema:
          type: string
          format: date-time
      - in: query
        name: created_on_lte
        schema:
          type: string
          format: date-time
      - in: query
        name: name
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: updated_on
        schema:
          type: string
          format: date-time
      - in: query
        name: updated_on_gt
        schema:
          type: string
          format: date-time
      - in: query
        name: updated_on_gte
        schema:
          type: string
          format: date-time
      - in: query
        name: updated_on_lt
        schema:
          type: string
          format: date-time
      - in: query
        name: updated_on_lte
        schema:
          type: string
          format: date-time
      tags:
      - v1
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedArtistSimpleList'
          description: ''
  /v1/artists/{uuid}/:
    get:
      operationId: v1_artists_retrieve
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this artist.
        required: true
      tags:
      - v1
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtistDetailed'
          description: ''
    delete:
      operationId: v1_artists_destroy
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this artist.
        required: true
      tags:
      - v1
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '204':
          description: No response body
  /v1/artists/{uuid}/genre-counts/:
    get:
      operationId: v1_artists_genre_counts_list
      description: Sparse per-genre-playlist counts of the artist's songs, for pruning
        the genre tree to their footprint.
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this artist.
        required: true
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArtistGenreCount'
          description: ''
  /v1/artists/import-runs/:
    post:
      operationId: v1_artists_import_runs_create
      description: 'Accepted modes: full, delta. Abandons every uncommitted run of
        the same kind.'
      parameters:
      - in: header
        name: X-Pipeline-Run-Request
        schema:
          type: string
        description: UUID of the running pipeline run this import belongs to, so its
          progress shows on that run.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportRunCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImportRunCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ImportRunCreateRequest'
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportRunCreated'
          description: ''
  /v1/artists/import-runs/{run_id}/commit/:
    post:
      operationId: v1_artists_import_runs_commit_create
      description: Queues the merge; poll its status with the returned task id.
      parameters:
      - in: path
        name: run_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskId'
          description: ''
  /v1/artists/import-runs/{run_id}/deletions/:
    put:
      operationId: v1_artists_import_runs_deletions_update
      description: 'Delta runs only: the deleted ids, gzip NDJSON with one `{"musicbrainz_artist_id":
        <uuid>}` per line.'
      parameters:
      - in: path
        name: run_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/x-ndjson:
            schema:
              type: string
              format: binary
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Count'
          description: ''
  /v1/artists/import-runs/{run_id}/parts/{part}/:
    put:
      operationId: v1_artists_import_runs_parts_update
      description: One gzip NDJSON part of the run's rows.
      parameters:
      - in: path
        name: part
        schema:
          type: integer
        required: true
      - in: path
        name: run_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/x-ndjson:
            schema:
              type: string
              format: binary
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Count'
          description: ''
  /v1/artists/import/{task_id}/status/:
    get:
      operationId: v1_artists_import_status_retrieve
      parameters:
      - in: path
        name: task_id
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportRunStatus'
          description: ''
  /v1/artists/search/:
    get:
      operationId: v1_artists_search_list
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
          maximum: 25
          minimum: 1
          default: 10
      - in: query
        name: q
        schema:
          type: string
          maxLength: 100
          minLength: 2
        required: true
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArtistSearchResult'
          description: ''
  /v1/auth/me/:
    get:
      operationId: v1_auth_me_retrieve
      tags:
      - v1
      security:
      - googleIdToken: []
      - apiKey: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMe'
          description: ''
  /v1/curation/{list_name}/entries/:
    get:
      operationId: v1_curation_entries_list
      parameters:
      - in: path
        name: list_name
        schema:
          type: string
        required: true
      - in: query
        name: ordering
        schema:
          type: string
          enum:
          - -updated_on
          - key
      - in: query
        name: page
        schema:
          type: integer
        description: 1-based page number.
      - in: query
        name: page_size
        schema:
          type: integer
        description: Rows per page, capped by the server.
      - in: query
        name: q
        schema:
          type: string
        description: Matched against the key, the values, the reason and the key's
          genre name.
      tags:
      - v1
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurationEntriesPage'
          description: ''
    post:
      operationId: v1_curation_entries_create
      parameters:
      - in: path
        name: list_name
        schema:
          type: string
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CurationRowRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CurationRowRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CurationRowRequest'
        required: true
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurationRule'
          description: ''
  /v1/curation/{list_name}/entries/{uuid}/:
    get:
      operationId: v1_curation_entries_retrieve
      parameters:
      - in: path
        name: list_name
        schema:
          type: string
        required: true
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurationRule'
          description: ''
    patch:
      operationId: v1_curation_entries_partial_update
      parameters:
      - in: path
        name: list_name
        schema:
          type: string
        required: true
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCurationRowRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCurationRowRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCurationRowRequest'
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurationRule'
          description: ''
    delete:
      operationId: v1_curation_entries_destroy
      parameters:
      - in: path
        name: list_name
        schema:
          type: string
        required: true
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '204':
          description: No response body
  /v1/curation/edges/:
    get:
      operationId: v1_curation_edges_list
      description: The curated genre edges (canonical/regional parents, roots, regional
        overviews, secondary parents).
      parameters:
      - in: query
        name: item_id
        schema:
          type: string
        description: Edges whose item or parent is this id.
      - in: query
        name: page
        schema:
          type: integer
        description: 1-based page number.
      - in: query
        name: page_size
        schema:
          type: integer
        description: Rows per page, capped by the server.
      - in: query
        name: q
        schema:
          type: string
        description: Matched against the ids, the reason and the ids' genre names.
      - in: query
        name: relation
        schema:
          type: string
          enum:
          - canonical_parent
          - regional_genre_parent
          - regional_overview
          - secondary_parent
      tags:
      - v1
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurationEdgesPage'
          description: ''
    post:
      operationId: v1_curation_edges_create
      description: The curated genre edges (canonical/regional parents, roots, regional
        overviews, secondary parents).
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/_Edge'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/_Edge'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/_Edge'
        required: true
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurationRule'
          description: ''
  /v1/curation/edges/{uuid}/:
    get:
      operationId: v1_curation_edges_retrieve
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurationRule'
          description: ''
    patch:
      operationId: v1_curation_edges_partial_update
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Patched_EdgePatch'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Patched_EdgePatch'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Patched_EdgePatch'
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurationRule'
          description: ''
    delete:
      operationId: v1_curation_edges_destroy
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '204':
          description: No response body
  /v1/curation/export/:
    get:
      operationId: v1_curation_export_retrieve
      description: |-
        Every list, and the edges (the genre edge rules, replacing the five legacy edge lists), as CSV-ready rows (header order, snake_case, booleans as "true"/""): the pipeline's input.

        `exported_on` is the export's instant: the pipeline carries it into Gold and sends it back on tree import, so grow
        knows which export the imported tree was built from.
      parameters:
      - in: query
        name: genre_alias_version
        schema:
          type: string
          enum:
          - '1'
          - '2'
        description: Defaults to 1.
      tags:
      - v1
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  canonical_parent_additions:
                    type: array
                    items:
                      type: object
                      properties:
                        item_id:
                          type: string
                          pattern: ^(?:Q[0-9]+|LOCAL:[a-z0-9-]+)$
                        label:
                          type: string
                          minLength: 1
                        reason:
                          type: string
                          minLength: 1
                      required:
                      - item_id
                      - label
                      - reason
                      additionalProperties: false
                  capitalized_words:
                    type: array
                    items:
                      type: object
                      properties:
                        word:
                          type: string
                          minLength: 1
                        capitalized:
                          type: string
                          minLength: 1
                        reason:
                          type: string
                          minLength: 1
                      required:
                      - word
                      - capitalized
                      - reason
                      additionalProperties: false
                  duplicate_genres:
                    type: array
                    items:
                      type: object
                      properties:
                        item_id:
                          type: string
                          pattern: ^(?:Q[0-9]+|LOCAL:[a-z0-9-]+)$
                        reason:
                          type: string
                          minLength: 1
                      required:
                      - item_id
                      - reason
                      additionalProperties: false
                  indigenous_to_exclusions:
                    type: array
                    items:
                      type: object
                      properties:
                        item_id:
                          type: string
                          pattern: ^(?:Q[0-9]+|LOCAL:[a-z0-9-]+)$
                        reason:
                          type: string
                          minLength: 1
                      required:
                      - item_id
                      - reason
                      additionalProperties: false
                  label_overrides:
                    type: array
                    items:
                      type: object
                      properties:
                        item_id:
                          type: string
                          pattern: ^(?:Q[0-9]+|LOCAL:[a-z0-9-]+)$
                        display_label:
                          type: string
                          minLength: 1
                        reason:
                          type: string
                          minLength: 1
                      required:
                      - item_id
                      - display_label
                      - reason
                      additionalProperties: false
                  forced_canonical_genres:
                    type: array
                    items:
                      type: object
                      properties:
                        item_id:
                          type: string
                          pattern: ^(?:Q[0-9]+|LOCAL:[a-z0-9-]+)$
                        reason:
                          type: string
                          minLength: 1
                      required:
                      - item_id
                      - reason
                      additionalProperties: false
                  out_of_scope_genres:
                    type: array
                    items:
                      type: object
                      properties:
                        item_id:
                          type: string
                          pattern: ^(?:Q[0-9]+|LOCAL:[a-z0-9-]+)$
                        reason:
                          type: string
                          minLength: 1
                      required:
                      - item_id
                      - reason
                      additionalProperties: false
                  overview_reclassifications:
                    type: array
                    items:
                      type: object
                      properties:
                        item_id:
                          type: string
                          pattern: ^(?:Q[0-9]+|LOCAL:[a-z0-9-]+)$
                        reason:
                          type: string
                          minLength: 1
                      required:
                      - item_id
                      - reason
                      additionalProperties: false
                  local_identities:
                    type: array
                    items:
                      type: object
                      properties:
                        item_id:
                          type: string
                          pattern: ^(?:Q[1-9][0-9]*|LOCAL:[a-z0-9]+(?:-[a-z0-9]+)*)$
                        kind:
                          type: string
                          enum:
                          - genre
                          - overview
                        label:
                          type: string
                          minLength: 1
                        decision_id:
                          type: string
                          minLength: 1
                        decision_source:
                          type: string
                          minLength: 1
                        reason:
                          type: string
                          minLength: 1
                      required:
                      - item_id
                      - kind
                      - label
                      - decision_id
                      - decision_source
                      - reason
                      additionalProperties: false
                  canonical_roots:
                    type: array
                    items:
                      type: object
                      properties:
                        item_id:
                          type: string
                          pattern: ^(?:Q[1-9][0-9]*|LOCAL:[a-z0-9]+(?:-[a-z0-9]+)*)$
                        decision_id:
                          type: string
                          minLength: 1
                        decision_source:
                          type: string
                          minLength: 1
                        reason:
                          type: string
                          minLength: 1
                      required:
                      - item_id
                      - decision_id
                      - decision_source
                      - reason
                      additionalProperties: false
                  regional_memberships:
                    type: array
                    items:
                      type: object
                      properties:
                        child_item_id:
                          type: string
                          pattern: ^(?:Q[1-9][0-9]*|LOCAL:[a-z0-9]+(?:-[a-z0-9]+)*)$
                        parent_item_id:
                          type: string
                          pattern: ^(?:Q[1-9][0-9]*|LOCAL:[a-z0-9]+(?:-[a-z0-9]+)*)$
                        action:
                          type: string
                          enum:
                          - add
                          - prohibit
                        decision_id:
                          type: string
                          minLength: 1
                        decision_source:
                          type: string
                          minLength: 1
                        reason:
                          type: string
                          minLength: 1
                      required:
                      - child_item_id
                      - parent_item_id
                      - action
                      - decision_id
                      - decision_source
                      - reason
                      additionalProperties: false
                  regional_anchorings:
                    type: array
                    items:
                      type: object
                      properties:
                        item_id:
                          type: string
                          pattern: ^(?:Q[1-9][0-9]*|LOCAL:[a-z0-9]+(?:-[a-z0-9]+)*)$
                        overview_item_id:
                          type: string
