  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Pipeline or curation key, held server-side.
    googleIdToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Google ID token, sent as `Authorization: Bearer <token>`.'
