openapi: 3.0.3
info:
  title: TheMusicTree grow API
  version: '1'
paths:
  /health/:
    get:
      operationId: health_retrieve
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          description: No response body
  /v1/albums/:
    get:
      operationId: v1_albums_list
      parameters:
      - in: query
        name: album_artist_name
        schema:
          type: string
      - in: query
        name: created_on
        schema:
          type: string
          format: date-time
      - in: query
        name: created_on_gt
        schema:
          type: string
          format: date-time
      - in: query
        name: created_on_gte
        schema:
          type: string
          format: date-time
      - in: query
        name: created_on_lt
        schema:
          type: string
          format: date-time
      - in: query
        name: created_on_lte
        schema:
          type: string
          format: date-time
      - in: query
        name: name
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: updated_on
        schema:
          type: string
          format: date-time
      - in: query
        name: updated_on_gt
        schema:
          type: string
          format: date-time
      - in: query
        name: updated_on_gte
        schema:
          type: string
          format: date-time
      - in: query
        name: updated_on_lt
        schema:
          type: string
          format: date-time
      - in: query
        name: updated_on_lte
        schema:
          type: string
          format: date-time
      tags:
      - v1
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAlbumSimpleList'
          description: ''
  /v1/albums/{uuid}/:
    get:
      operationId: v1_albums_retrieve
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this album.
        required: true
      tags:
      - v1
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlbumDetailed'
          description: ''
    delete:
      operationId: v1_albums_destroy
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this album.
        required: true
      tags:
      - v1
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '204':
          description: No response body
  /v1/artists/:
    get:
      operationId: v1_artists_list
      parameters:
      - in: query
        name: created_on
        schema:
          type: string
          format: date-time
      - in: query
        name: created_on_gt
        schema:
          type: string
          format: date-time
      - in: query
        name: created_on_gte
        schema:
          type: string
          format: date-time
      - in: query
        name: created_on_lt
        schema:
          type: string
          format: date-time
      - in: query
        name: created_on_lte
        schema:
          type: string
          format: date-time
      - in: query
        name: name
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: updated_on
        schema:
          type: string
          format: date-time
      - in: query
        name: updated_on_gt
        schema:
          type: string
          format: date-time
      - in: query
        name: updated_on_gte
        schema:
          type: string
          format: date-time
      - in: query
        name: updated_on_lt
        schema:
          type: string
          format: date-time
      - in: query
        name: updated_on_lte
        schema:
          type: string
          format: date-time
      tags:
      - v1
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedArtistSimpleList'
          description: ''
  /v1/artists/{uuid}/:
    get:
      operationId: v1_artists_retrieve
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this artist.
        required: true
      tags:
      - v1
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtistDetailed'
          description: ''
    delete:
      operationId: v1_artists_destroy
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this artist.
        required: true
      tags:
      - v1
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '204':
          description: No response body
  /v1/artists/{uuid}/genre-counts/:
    get:
      operationId: v1_artists_genre_counts_retrieve
      description: Sparse per-genre-playlist counts of the artist's songs, for pruning
        the genre tree to their footprint.
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this artist.
        required: true
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          description: No response body
  /v1/artists/import-runs/:
    post:
      operationId: v1_artists_import_runs_create
      tags:
      - v1
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '200':
          description: No response body
  /v1/artists/import-runs/{run_id}/commit/:
    post:
      operationId: v1_artists_import_runs_commit_create
      parameters:
      - in: path
        name: run_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - v1
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '200':
          description: No response body
  /v1/artists/import-runs/{run_id}/deletions/:
    put:
      operationId: v1_artists_import_runs_deletions_update
      parameters:
      - in: path
        name: run_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - v1
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '200':
          description: No response body
  /v1/artists/import-runs/{run_id}/parts/{part}/:
    put:
      operationId: v1_artists_import_runs_parts_update
      parameters:
      - in: path
        name: part
        schema:
          type: string
          pattern: ^\d+$
        required: true
      - in: path
        name: run_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - v1
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '200':
          description: No response body
  /v1/artists/import/{task_id}/status/:
    get:
      operationId: v1_artists_import_status_retrieve
      parameters:
      - in: path
        name: task_id
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '200':
          description: No response body
  /v1/artists/search/:
    get:
      operationId: v1_artists_search_retrieve
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          description: No response body
  /v1/auth/me/:
    get:
      operationId: v1_auth_me_retrieve
      tags:
      - v1
      security:
      - googleIdToken: []
      - apiKey: []
      - {}
      responses:
        '200':
          description: No response body
  /v1/curation/{list_name}/entries/:
    get:
      operationId: v1_curation_entries_retrieve
      parameters:
      - in: path
        name: list_name
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '200':
          description: No response body
    post:
      operationId: v1_curation_entries_create
      parameters:
      - in: path
        name: list_name
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '200':
          description: No response body
  /v1/curation/{list_name}/entries/{uuid}/:
    get:
      operationId: v1_curation_entries_retrieve_2
      parameters:
      - in: path
        name: list_name
        schema:
          type: string
        required: true
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '200':
          description: No response body
    patch:
      operationId: v1_curation_entries_partial_update
      parameters:
      - in: path
        name: list_name
        schema:
          type: string
        required: true
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '200':
          description: No response body
    delete:
      operationId: v1_curation_entries_destroy
      parameters:
      - in: path
        name: list_name
        schema:
          type: string
        required: true
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '204':
          description: No response body
  /v1/curation/edges/:
    get:
      operationId: v1_curation_edges_retrieve
      description: The curated genre edges (canonical/regional parents, roots, regional
        overviews, secondary parents).
      tags:
      - v1
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '200':
          description: No response body
    post:
      operationId: v1_curation_edges_create
      description: The curated genre edges (canonical/regional parents, roots, regional
        overviews, secondary parents).
      tags:
      - v1
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '200':
          description: No response body
  /v1/curation/edges/{uuid}/:
    get:
      operationId: v1_curation_edges_retrieve_2
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '200':
          description: No response body
    patch:
      operationId: v1_curation_edges_partial_update
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '200':
          description: No response body
    delete:
      operationId: v1_curation_edges_destroy
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '204':
          description: No response body
  /v1/curation/export/:
    get:
      operationId: v1_curation_export_retrieve
      description: |-
        Every list, and the edges (the genre edge rules, replacing the five legacy edge lists), as CSV-ready rows (header order, snake_case, booleans as "true"/""): the pipeline's input.

        `exported_on` is the export's instant: the pipeline carries it into Gold and sends it back on tree import, so grow
        knows which export the imported tree was built from.
      tags:
      - v1
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '200':
          description: No response body
  /v1/curation/history/:
    get:
      operationId: v1_curation_history_retrieve
      description: Edits to canonical entries and edges, newest first, optionally
        narrowed to a `list`, an `entry` uuid or an `item_id`.
      tags:
      - v1
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '200':
          description: No response body
  /v1/curation/items/:
    get:
      operationId: v1_curation_items_retrieve
      description: 'Items matching `q` by id or name, for an admin to pick one: the
        canonical tree, the catalog and pending additions.'
      tags:
      - v1
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '200':
          description: No response body
  /v1/curation/lists/:
    get:
      operationId: v1_curation_lists_retrieve
      tags:
      - v1
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '200':
          description: No response body
  /v1/curation/review/:
    get:
      operationId: v1_curation_review_retrieve
      description: The curation item ids the pipeline's last report couldn't resolve,
        for an admin to fix.
      tags:
      - v1
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '200':
          description: No response body
  /v1/curation/rules/:
    get:
      operationId: v1_curation_rules_retrieve
      description: Every canonical entry and edge referencing an item.
      tags:
      - v1
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '200':
          description: No response body
  /v1/curation/status/:
    get:
      operationId: v1_curation_status_retrieve
      description: Which pipeline export the canonical tree was last built from, and
        how many entries were edited since.
      tags:
      - v1
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '200':
          description: No response body
  /v1/curation/wikidata-items/:
    post:
      operationId: v1_curation_wikidata_items_create
      description: 'The pipeline''s catalog of every Wikidata item it knows, pruned
        ones included: replaces the previous one.'
      tags:
      - v1
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '200':
          description: No response body
  /v1/curation/wikidata-resolutions/:
    post:
      operationId: v1_curation_wikidata_resolutions_create
      description: 'The pipeline''s Wikidata resolution of curation item ids: redirects
        to remap, and ids it couldn''t resolve.'
      tags:
      - v1
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '200':
          description: No response body
  /v1/genealogy/:
    get:
      operationId: v1_genealogy_retrieve
      description: The latest genealogy snapshot, public, revalidated by its checksum.
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          description: No response body
  /v1/genealogy/import/:
    post:
      operationId: v1_genealogy_import_create
      description: 'Pipeline import of the genealogy document. Parsed and rendered
        verbatim: the document''s keys must not be recased.'
      tags:
      - v1
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '200':
          description: No response body
  /v1/genre-playlists/:
    get:
      operationId: v1_genre_playlists_list
      description: |-
        Adds a paginated `{uuid}/tracks` action listing the playlist's track relations in
        play order (position ascending, unpositioned last). Mix into an `AppModelViewSet`
        subclass for a playlist viewset and set `track_playlist_rel_serializer_class`.

        `?from=<track uuid>` starts the list at that track's relation (inclusive); 404 if the
        track is not in the playlist, 400 if the value is not a UUID.
      parameters:
      - in: query
        name: created_on
        schema:
          type: string
          format: date-time
      - in: query
        name: created_on_gt
        schema:
          type: string
          format: date-time
      - in: query
        name: created_on_gte
        schema:
          type: string
          format: date-time
      - in: query
        name: created_on_lt
        schema:
          type: string
          format: date-time
      - in: query
        name: created_on_lte
        schema:
          type: string
          format: date-time
      - in: query
        name: name
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: parent
        schema:
          type: string
      - in: query
        name: tree_name
        schema:
          type: string
          enum:
          - canonical
          - regional
        description: |-
          * `canonical` - Canonical
          * `regional` - Regional
      - in: query
        name: updated_on
        schema:
          type: string
          format: date-time
      - in: query
        name: updated_on_gt
        schema:
          type: string
          format: date-time
      - in: query
        name: updated_on_gte
        schema:
          type: string
          format: date-time
      - in: query
        name: updated_on_lt
        schema:
          type: string
          format: date-time
      - in: query
        name: updated_on_lte
        schema:
          type: string
          format: date-time
      tags:
      - v1
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCriteriaPlaylistSimpleList'
          description: ''
  /v1/genre-playlists/{uuid}/:
    get:
      operationId: v1_genre_playlists_retrieve
      description: |-
        Adds a paginated `{uuid}/tracks` action listing the playlist's track relations in
        play order (position ascending, unpositioned last). Mix into an `AppModelViewSet`
        subclass for a playlist viewset and set `track_playlist_rel_serializer_class`.

        `?from=<track uuid>` starts the list at that track's relation (inclusive); 404 if the
        track is not in the playlist, 400 if the value is not a UUID.
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this genre playlist.
        required: true
      tags:
      - v1
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CriteriaPlaylistDetailed'
          description: ''
  /v1/genre-playlists/{uuid}/tracks/:
    get:
      operationId: v1_genre_playlists_tracks_retrieve
      description: |-
        Adds a paginated `{uuid}/tracks` action listing the playlist's track relations in
        play order (position ascending, unpositioned last). Mix into an `AppModelViewSet`
        subclass for a playlist viewset and set `track_playlist_rel_serializer_class`.

        `?from=<track uuid>` starts the list at that track's relation (inclusive); 404 if the
        track is not in the playlist, 400 if the value is not a UUID.
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this genre playlist.
        required: true
      tags:
      - v1
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '200':
          description: No response body
  /v1/genre-playlists/tree/:
    get:
      operationId: v1_genre_playlists_tree_retrieve
      description: Whole genre tree, unpaginated, cached under the DB-trigger-maintained
        GenreTreeVersion token.
      tags:
      - v1
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '200':
          description: No response body
  /v1/genres/:
    get:
      operationId: v1_genres_list
      parameters:
      - in: query
        name: created_on
        schema:
          type: string
          format: date-time
      - in: query
        name: created_on_gt
        schema:
          type: string
          format: date-time
      - in: query
        name: created_on_gte
        schema:
          type: string
          format: date-time
      - in: query
        name: created_on_lt
        schema:
          type: string
          format: date-time
      - in: query
        name: created_on_lte
        schema:
          type: string
          format: date-time
      - in: query
        name: has_name_conflict
        schema:
          type: boolean
      - in: query
        name: is_umbrella
        schema:
          type: boolean
      - in: query
        name: is_unaccepted_root
        schema:
          type: boolean
      - in: query
        name: name
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: parent
        schema:
          type: string
      - in: query
        name: scene
        schema:
          type: string
          nullable: true
          enum:
          - commercial
          - underground
        description: |-
          * `commercial` - Commercial
          * `underground` - Underground
      - in: query
        name: updated_on
        schema:
          type: string
          format: date-time
      - in: query
        name: updated_on_gt
        schema:
          type: string
          format: date-time
      - in: query
        name: updated_on_gte
        schema:
          type: string
          format: date-time
      - in: query
        name: updated_on_lt
        schema:
          type: string
          format: date-time
      - in: query
        name: updated_on_lte
        schema:
          type: string
          format: date-time
      - in: query
        name: wikidata_id
        schema:
          type: string
      tags:
      - v1
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedGenreSimpleList'
          description: ''
    post:
      operationId: v1_genres_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenrePost'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GenrePost'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GenrePost'
        required: true
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenrePost'
          description: ''
  /v1/genres/{uuid}/:
    get:
      operationId: v1_genres_retrieve
      parameters:
      - in: path
