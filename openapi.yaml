          type: integer
        required: true
      - in: path
        name: run_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/x-ndjson:
            schema:
              type: string
              format: binary
            x-ndjson-item-schema:
              type: object
              properties:
                musicbrainz_recording_id:
                  type: string
                  format: uuid
                title:
                  type: string
                  minLength: 1
                  maxLength: 2048
                artist:
                  type: string
                  minLength: 1
                  maxLength: 2048
                artist_musicbrainz_id:
                  type:
                  - string
                  - 'null'
                  format: uuid
                youtube_video_id:
                  type:
                  - string
                  - 'null'
                  minLength: 1
                  maxLength: 11
                youtube_unplayable_reason:
                  enum:
                  - not_embeddable
                  - not_found
                  - not_processed
                  - private
                  - region_whitelisted
                  - null
                genre_name:
                  type:
                  - string
                  - 'null'
                  minLength: 1
                  maxLength: 256
                genre_wikidata_id:
                  type:
                  - string
                  - 'null'
                  pattern: Q[0-9]+|LOCAL:[a-z0-9-]+
                youtube_view_count:
                  type:
                  - integer
                  - 'null'
                  minimum: 0
                  maximum: 9223372036854775807
                first_release_year:
                  type:
                  - integer
                  - 'null'
                  minimum: 0
                  maximum: 32767
                recording_count:
                  type:
                  - integer
                  - 'null'
                  minimum: 1
                  maximum: 2147483647
                youtube_region_restriction:
                  anyOf:
                  - type: 'null'
                  - type: object
                    properties:
                      mode:
                        enum:
                        - allowed
                        - blocked
                        - unrestricted
                      countries:
                        type: array
                        items:
                          type: string
                          pattern: ^(?!XX$)[A-Z]{2}$
                          maxLength: 2
                    required:
