openapi: 3.1.0
info:
  title: TheMusicTree grow API
  version: '1'
paths:
  /health/:
    get:
      operationId: health_retrieve
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: The database check failed.
  /v1/albums/:
    get:
      operationId: v1_albums_list
      parameters:
      - in: query
        name: album_artist_name
        schema:
          type: string
      - in: query
        name: created_on
        schema:
          type: string
          format: date-time
      - in: query
        name: created_on_gt
        schema:
          type: string
          format: date-time
      - in: query
        name: created_on_gte
        schema:
          type: string
          format: date-time
      - in: query
        name: created_on_lt
        schema:
          type: string
          format: date-time
      - in: query
        name: created_on_lte
        schema:
          type: string
          format: date-time
      - in: query
        name: name
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: updated_on
        schema:
          type: string
          format: date-time
      - in: query
        name: updated_on_gt
        schema:
          type: string
          format: date-time
      - in: query
        name: updated_on_gte
        schema:
          type: string
          format: date-time
      - in: query
        name: updated_on_lt
        schema:
          type: string
          format: date-time
      - in: query
        name: updated_on_lte
        schema:
          type: string
          format: date-time
      tags:
      - v1
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAlbumSimpleList'
          description: ''
  /v1/albums/{uuid}/:
    get:
      operationId: v1_albums_retrieve
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this album.
        required: true
      tags:
      - v1
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlbumDetailed'
          description: ''
    delete:
      operationId: v1_albums_destroy
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this album.
        required: true
      tags:
      - v1
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '204':
          description: No response body
  /v1/artists/:
    get:
      operationId: v1_artists_list
      parameters:
      - in: query
        name: created_on
        schema:
          type: string
          format: date-time
      - in: query
        name: created_on_gt
        schema:
          type: string
          format: date-time
      - in: query
        name: created_on_gte
        schema:
          type: string
          format: date-time
      - in: query
        name: created_on_lt
        schema:
          type: string
          format: date-time
      - in: query
        name: created_on_lte
        schema:
          type: string
          format: date-time
      - in: query
        name: name
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: updated_on
        schema:
          type: string
          format: date-time
      - in: query
        name: updated_on_gt
        schema:
          type: string
          format: date-time
      - in: query
        name: updated_on_gte
        schema:
          type: string
          format: date-time
      - in: query
        name: updated_on_lt
        schema:
          type: string
          format: date-time
      - in: query
        name: updated_on_lte
        schema:
          type: string
          format: date-time
      tags:
      - v1
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedArtistSimpleList'
          description: ''
  /v1/artists/{uuid}/:
    get:
      operationId: v1_artists_retrieve
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this artist.
        required: true
      tags:
      - v1
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtistDetailed'
          description: ''
    delete:
      operationId: v1_artists_destroy
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this artist.
        required: true
      tags:
      - v1
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '204':
          description: No response body
  /v1/artists/{uuid}/genre-counts/:
    get:
      operationId: v1_artists_genre_counts_list
      description: Sparse per-genre-playlist counts of the artist's songs, for pruning
        the genre tree to their footprint.
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this artist.
        required: true
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArtistGenreCount'
          description: ''
  /v1/artists/import-runs/:
    post:
      operationId: v1_artists_import_runs_create
      description: 'Accepted modes: full, delta. Abandons every uncommitted run of
        the same kind.'
      parameters:
      - in: header
        name: X-Pipeline-Run-Request
        schema:
          type: string
        description: UUID of the running pipeline run this import belongs to, so its
          progress shows on that run.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtistImportRunCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ArtistImportRunCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ArtistImportRunCreateRequest'
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportRunCreated'
          description: ''
  /v1/artists/import-runs/{run_id}/commit/:
    post:
      operationId: v1_artists_import_runs_commit_create
      description: Queues the merge; poll its status with the returned task id.
      parameters:
      - in: header
        name: X-Pipeline-Run-Request
        schema:
          type: string
        description: UUID of the running pipeline run this import belongs to, so its
          progress shows on that run.
      - in: path
        name: run_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskId'
          description: ''
  /v1/artists/import-runs/{run_id}/deletions/:
    put:
      operationId: v1_artists_import_runs_deletions_update
      description: 'Delta runs only: the deleted ids, gzip NDJSON with one `{"musicbrainz_artist_id":
        <uuid>}` per line.'
      parameters:
      - in: path
        name: run_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/x-ndjson:
            schema:
              type: string
              format: binary
            x-ndjson-item-schema:
              type: object
              properties:
                musicbrainz_artist_id:
                  type: string
                  format: uuid
              required:
              - musicbrainz_artist_id
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Count'
          description: ''
  /v1/artists/import-runs/{run_id}/parts/{part}/:
    put:
      operationId: v1_artists_import_runs_parts_update
      description: One gzip NDJSON part of the run's rows.
      parameters:
      - in: header
        name: X-Pipeline-Run-Request
        schema:
          type: string
        description: UUID of the running pipeline run this import belongs to, so its
          progress shows on that run.
      - in: path
        name: part
        schema:
          type: integer
        required: true
      - in: path
        name: run_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/x-ndjson:
            schema:
              type: string
              format: binary
            x-ndjson-item-schema:
              $ref: '#/components/schemas/ArtistUploadRow'
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Count'
          description: ''
  /v1/artists/import/{task_id}/status/:
    get:
      operationId: v1_artists_import_status_retrieve
      parameters:
      - in: path
        name: task_id
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogueImportRunStatus'
          description: ''
  /v1/artists/search/:
    get:
      operationId: v1_artists_search_list
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
          maximum: 25
          minimum: 1
          default: 10
      - in: query
        name: q
        schema:
          type: string
          maxLength: 100
          minLength: 2
        required: true
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArtistSearchResult'
          description: ''
  /v1/auth/me/:
    get:
      operationId: v1_auth_me_retrieve
      tags:
      - v1
      security:
      - googleIdToken: []
      - apiKey: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMe'
          description: ''
  /v1/curation/{list_name}/entries/:
    get:
      operationId: v1_curation_entries_list
      parameters:
      - in: path
        name: list_name
        schema:
          type: string
        required: true
      - in: query
        name: ordering
        schema:
          type: string
          enum:
          - -updated_on
          - key
      - in: query
        name: page
        schema:
          type: integer
        description: 1-based page number.
      - in: query
        name: page_size
        schema:
          type: integer
        description: Rows per page, capped by the server.
      - in: query
        name: q
        schema:
          type: string
        description: Matched against the key, the values, the reason and the key's
          genre name.
      tags:
      - v1
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurationEntriesPage'
          description: ''
    post:
      operationId: v1_curation_entries_create
      parameters:
      - in: path
        name: list_name
        schema:
          type: string
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CurationRowRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CurationRowRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CurationRowRequest'
        required: true
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurationRule'
          description: ''
  /v1/curation/{list_name}/entries/{uuid}/:
    get:
      operationId: v1_curation_entries_retrieve
      parameters:
      - in: path
        name: list_name
        schema:
          type: string
        required: true
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurationRule'
          description: ''
    patch:
      operationId: v1_curation_entries_partial_update
      parameters:
      - in: path
        name: list_name
        schema:
          type: string
        required: true
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCurationRowRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCurationRowRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCurationRowRequest'
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurationRule'
          description: ''
    delete:
      operationId: v1_curation_entries_destroy
      parameters:
      - in: path
        name: list_name
        schema:
          type: string
        required: true
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '204':
          description: No response body
  /v1/curation/edges/:
    get:
      operationId: v1_curation_edges_list
      description: 'The curated genre edges: classification, derivation and influence
        decisions, asserted or prohibited.'
      parameters:
      - in: query
        name: item_id
        schema:
          type: string
        description: Edges whose item or target is this id.
      - in: query
        name: page
        schema:
          type: integer
        description: 1-based page number.
      - in: query
        name: page_size
        schema:
          type: integer
        description: Rows per page, capped by the server.
      - in: query
        name: q
        schema:
          type: string
        description: Matched against the ids, the reason and the ids' genre names.
      - in: query
        name: relation
        schema:
          type: string
          enum:
          - classification
          - derivation
          - influence
      tags:
      - v1
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurationEdgesPage'
          description: ''
    post:
      operationId: v1_curation_edges_create
      description: 'The curated genre edges: classification, derivation and influence
        decisions, asserted or prohibited.'
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/_Edge'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/_Edge'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/_Edge'
        required: true
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurationRule'
          description: ''
  /v1/curation/edges/{uuid}/:
    get:
      operationId: v1_curation_edges_retrieve
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurationRule'
          description: ''
    patch:
      operationId: v1_curation_edges_partial_update
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Patched_EdgePatch'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Patched_EdgePatch'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Patched_EdgePatch'
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurationRule'
          description: ''
    delete:
      operationId: v1_curation_edges_destroy
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '204':
          description: No response body
  /v1/curation/export/:
    get:
      operationId: v1_curation_export_retrieve
      description: |-
        Every list, and the genre edge rules (`edges`), as CSV-ready rows (header order, snake_case, booleans as "true"/""): the pipeline's input.

        `exported_on` is the export's instant: the pipeline carries it into Gold and sends it back on tree import, so grow
        knows which export the imported tree was built from.
      tags:
      - v1
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurationExport'
          description: ''
        '409':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                  violations:
                    type: array
                    items:
                      type: object
                      properties:
                        kind:
                          type: string
                        message:
                          type: string
                        item_ids:
                          type: array
                          items:
                            type: string
                      required:
                      - kind
                      - message
                      - item_ids
                      additionalProperties: false
                required:
                - detail
                - violations
                additionalProperties: false
          description: ''
  /v1/curation/genre-alias-targets/:
    get:
      operationId: v1_curation_genre_alias_targets_retrieve
      parameters:
      - in: query
        name: q
        schema:
          type: string
        description: Matched against ids and names.
        required: true
      tags:
      - v1
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenreAliasTargets'
          description: ''
        '503':
          description: The genre alias catalogue is not published yet (api-kit error
            envelope).
  /v1/curation/history/:
    get:
      operationId: v1_curation_history_retrieve
      description: Edits to canonical entries and edges, newest first, optionally
        narrowed to a `list`, an `entry` uuid or an `item_id`.
      parameters:
      - in: query
        name: entry
        schema:
          type: string
          format: uuid
      - in: query
        name: item_id
        schema:
          type: string
        description: A Wikidata QID or a `LOCAL:<slug>` id.
      - in: query
        name: list
        schema:
          type: string
        description: A curation list, `genre_edges` or a retired list.
      - in: query
        name: page
        schema:
          type: integer
        description: 1-based page number.
      - in: query
        name: page_size
        schema:
          type: integer
        description: Rows per page, capped by the server.
      tags:
      - v1
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurationHistoryPage'
          description: ''
  /v1/curation/items/:
    get:
      operationId: v1_curation_items_retrieve
      description: 'Items matching `q` by id or name, for an admin to pick one: the
        grow genres, the catalog and pending additions.'
      parameters:
      - in: query
        name: q
        schema:
          type: string
        description: Matched against ids and names.
        required: true
      tags:
      - v1
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurationItems'
          description: ''
  /v1/curation/lists/:
    get:
      operationId: v1_curation_lists_list
      tags:
      - v1
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CurationList'
          description: ''
  /v1/curation/review/:
    get:
      operationId: v1_curation_review_list
      description: The curation item ids the pipeline's last report couldn't resolve,
        for an admin to fix.
      tags:
      - v1
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CurationReviewItem'
          description: ''
  /v1/curation/rules/:
    get:
      operationId: v1_curation_rules_retrieve
      description: Every canonical entry and edge referencing an item.
      parameters:
      - in: query
        name: item_id
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurationRules'
          description: ''
  /v1/curation/status/:
    get:
      operationId: v1_curation_status_retrieve
      description: Which pipeline export the genre trees were last built from, and
        how many entries were edited since.
      tags:
      - v1
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurationStatus'
          description: ''
  /v1/curation/wikidata-items/:
    post:
      operationId: v1_curation_wikidata_items_create
      description: 'The pipeline''s catalog of every Wikidata item it knows, pruned
        ones included: replaces the previous one.'
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/_WikidataItems'
          multipart/form-data:
