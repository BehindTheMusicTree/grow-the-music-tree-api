  /v1/curation/genre-alias-targets/:
    get:
      operationId: v1_curation_genre_alias_targets_retrieve
      parameters:
      - in: query
        name: q
        schema:
          type: string
        description: Matched against ids and names.
        required: true
      tags:
      - v1
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenreAliasTargets'
          description: ''
        '503':
          description: The genre alias catalogue is not published yet (api-kit error
            envelope).
  /v1/curation/history/:
    get:
      operationId: v1_curation_history_retrieve
      description: Edits to canonical entries and edges, newest first, optionally
        narrowed to a `list`, an `entry` uuid or an `item_id`.
      parameters:
      - in: query
        name: entry
        schema:
          type: string
          format: uuid
      - in: query
        name: item_id
        schema:
          type: string
        description: A Wikidata QID or a `LOCAL:<slug>` id.
      - in: query
        name: list
        schema:
          type: string
        description: A curation list, an edge projection list or a retired list.
      - in: query
        name: page
        schema:
          type: integer
        description: 1-based page number.
      - in: query
        name: page_size
        schema:
          type: integer
        description: Rows per page, capped by the server.
      tags:
      - v1
      security:
      - googleIdToken: []
      - apiKey: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurationHistoryPage'
          description: ''
