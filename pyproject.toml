[project]
name = "grow-the-music-tree-api"
version = "4.0.0"
description = "Reference genre/tag/tree service for grow-the-music-tree-frontend"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "Django==5.2.8",
    "djangorestframework==3.15.1",
    "django-filter==25.2",
    "django-cors-headers==4.3.1",
    "dj-database-url==2.3.0",
    "psycopg[binary]==3.2.13",
    "gunicorn==23.0.0",
    "djangorestframework-camel-case==1.4.2",
    "django-q2==1.11.1",
    "redis==8.1.0",
    "the-music-tree-genre-kit @ git+https://github.com/BehindTheMusicTree/the-music-tree-genre-kit.git@v0.23.4",
    "google-auth[requests]==2.58.0",
    "cachecontrol==0.14.4",
]

[project.optional-dependencies]
dev = [
    "django-stubs==5.2.1",
    "mypy==1.18.2",
    "pytest==8.1.1",
    "pytest-cov==7.1.0",
    "pytest-django==4.8.0",
    "ruff==0.15.9",
]

[tool.uv]
package = false
# cryptography 49+ ships no macOS x86_64 wheel: pin Intel Macs below it (no from-source Rust build), keep the rest current.
constraint-dependencies = [
    "cryptography<49; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "cryptography>=49; sys_platform != 'darwin' or platform_machine != 'x86_64'",
]

[tool.ruff]
# Shared rule set vendored from the-music-tree-genre-kit/baselines/ruff.toml (itself vendored from hear-the-music-tree-api).
extend = "baselines/ruff.toml"
extend-exclude = ["**/migrations"]

[tool.ruff.lint.per-file-ignores]
# Deferred imports are used deliberately across Django models, serializers, and tests.
"grow/**" = ["PLC0415"]
"manage.py" = ["PLC0415"]

[tool.mypy]
python_version = "3.14"
plugins = ["mypy_django_plugin.main"]
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
no_implicit_optional = false
warn_return_any = false
disable_error_code = [
    "abstract",
    "arg-type",
    "assignment",
    "attr-defined",
    "dict-item",
    "misc",
    "no-redef",
    "operator",
    "override",
    "return",
    "return-value",
    "type-abstract",
    "type-var",
    "union-attr",
    "valid-type",
    "var-annotated",
]

[tool.django-stubs]
django_settings_module = "grow.settings"

[[tool.mypy.overrides]]
module = "grow.migrations.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "pytest"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
DJANGO_SETTINGS_MODULE = "tests.settings"
addopts = "--cov=grow --cov-report=term-missing --cov-fail-under=85"
