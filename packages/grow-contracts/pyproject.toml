[project]
name = "the-music-tree-grow-contracts"
version = "0.0.0"
description = "JSON Schemas and curation list specs of the documents exchanged with grow-the-music-tree-api"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "mignot", email = "garcia.andreas.1991@gmail.com" }]
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.26,<5"]

[project.urls]
Repository = "https://github.com/BehindTheMusicTree/grow-the-music-tree-api"
Documentation = "https://github.com/BehindTheMusicTree/grow-the-music-tree-api/blob/main/packages/grow-contracts/README.md"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"
